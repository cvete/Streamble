name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: streamble
          POSTGRES_PASSWORD: streamble
          POSTGRES_DB: streamble
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U streamble"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      STREAMBLE_TEST_POSTGRES: postgres://streamble:streamble@127.0.0.1:5432/streamble?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Install FFmpeg (for end-to-end tests)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/panel/package-lock.json
      - name: Control panel is built and committed
        run: make ui-check
      - name: Lint
        run: make lint
      - name: Test
        run: make test
      - name: Build
        run: make build

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t streamble:ci .
      - name: Smoke test (panel, API, FFmpeg)
        run: |
          docker run -d --name s -p 8080:8080 -e STREAMBLE_ADMIN_PASSWORD=ci-password-123 streamble:ci
          for i in $(seq 1 30); do curl -fsS localhost:8080/api/v1/health && break; sleep 1; done
          curl -fsS localhost:8080/panel/ | grep -q '<div id="root">'
          code=$(curl -s -o /dev/null -w '%{http_code}' -H 'Content-Type: application/json' \
            -d '{"username":"admin","password":"ci-password-123"}' localhost:8080/api/v1/auth/login)
          test "$code" = 200
          docker exec s ffmpeg -hide_banner -version | head -1
          test "$(docker inspect -f '{{.State.Health.Status}}' s)" != unhealthy
          docker logs s
