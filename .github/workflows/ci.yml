name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: streamble
          POSTGRES_PASSWORD: streamble
          POSTGRES_DB: streamble
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U streamble"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      STREAMBLE_TEST_POSTGRES: postgres://streamble:streamble@127.0.0.1:5432/streamble?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Install FFmpeg (for end-to-end tests)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/panel/package-lock.json
      - name: Control panel is built and committed
        run: make ui-check
      - name: Lint
        run: make lint
      - name: Test
        run: make test
      - name: Build
        run: make build
